<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — Budget Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #faf9f6;
      --surface: #ffffff;
      --border:  #e8e4de;
      --accent:  #3d7a5c;
      --text:    #1a1a1a;
      --muted:   #6b6560;
      --dim:     #aaa49e;
      --serif:   'Playfair Display', Georgia, serif;
      --sans:    'DM Sans', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(1.5rem, 6vw, 5rem);
      height: 60px;
      background: rgba(250, 249, 246, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .nav-links { display: flex; gap: 2rem; list-style: none; }

    .nav-links a {
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .nav-links a:hover { color: var(--text); }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 4rem clamp(1.5rem, 5vw, 2rem) 6rem;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .page-meta {
      font-size: 0.78rem;
      color: var(--dim);
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .content h2 {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--text);
      margin: 2.25rem 0 0.6rem;
    }

    .content h3 {
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text);
      margin: 1.5rem 0 0.4rem;
    }

    .content p {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 1rem;
      line-height: 1.75;
    }

    .content ul, .content ol {
      padding-left: 1.4rem;
      margin-bottom: 1rem;
    }

    .content li {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 0.35rem;
      line-height: 1.65;
    }

    .content a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .content strong { color: var(--text); font-weight: 500; }

    footer {
      border-top: 1px solid var(--border);
      padding: 2rem clamp(1.5rem, 6vw, 5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-copy { font-size: 0.78rem; color: var(--dim); }

    .footer-links { display: flex; gap: 1.75rem; list-style: none; flex-wrap: wrap; }

    .footer-links a {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-links a:hover { color: var(--text); }

    @media (max-width: 400px) {
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Budget Buddy</a>
    <ul class="nav-links">
      <li><a href="/privacy">Privacy</a></li>
      <li><a href="/support">Support</a></li>
      <li><a href="/terms">Terms</a></li>
    </ul>
  </nav>

  <main>
    <h1>{{ page.title }}</h1>
    {% if page.updated %}<p class="page-meta">Last updated: {{ page.updated }}</p>{% endif %}
    <div class="content">
      {{ content }}
    </div>
  </main>

  <footer>
    <span class="footer-copy">© 2026 Budget Buddy</span>
    <ul class="footer-links">
      <li><a href="/privacy">Privacy Policy</a></li>
      <li><a href="/support">Support</a></li>
      <li><a href="/terms">Terms of Use</a></li>
    </ul>
  </footer>

</body>
</html>
